# Metadata for the core parameter (etc/smarthome.yaml)
module:
    # Global pseido-module attributes
    classname: None
    version: 1.5.7
    description:
        de: 'Core des SmartHomeNG Systems'
        en: 'Core of the SmartHomeNG system'
        fr: 'Coeur du système SmartHomeNG'

parameters:
    # live: True = a change saved from the admin UI applies to the running core without restart
    # Definition of parameters to be configured in etc/module.yaml
    lat:
        type: num
        default: 53.5989481
        description:
            de: Breitengrad der SmartHomeNG Installation
            en: Lattitude of the SmartHomeNG installation
            fr: Degré de latitude de l'installation SmartHomeNG
    lon:
        type: num
        default: 10.0459898
        description:
            de: Längengrad der SmartHomeNG Installation
            en: Logitude of the SmartHomeNG installation
            fr: Degré de longitude de l'installation SmartHomeNG
    elev:
        type: num
        default: 20
        description:
            de: Höhe der SmartHomeNG Installation über Normal-Null
            en: Elevation of the SmartHomeNG installation
            fr: Élévation de l'installation SmartHomeNG

    tz:
        type: str
        default: 'Europe/Berlin'
        description:
            de: Zeitzone der SmartHomeNG Installation
            en: timezone of the SmartHomeNG installation
            fr: Fuseau horaire de l'installation SmartHomeNG

    default_language:
        type: str
        default: 'de'
        valid_list: ['de', 'en', 'fr', 'pl']
        description:
            de: Standard-Sprache der SmartHomeNG Installation
            en: Default language of the SmartHomeNG installation
            fr: Langue par défaut de l'installation SmartHomeNG

    fallback_language_order:
        type: str
        default: en,de
        valid_list: ['en,de', 'de,en']
        description:
            de: 'Reihenfolge der Sprachen in der Texte gesucht werden, wenn der Text in der gewählten Sprache nicht vorhanden ist, falls die gewählte Sprache nicht Deutsch oder Englisch ist'
            en: 'Order of languages in which texts are searched, if the text is not available in the selected language'
            fr: "Ordre des langues dans lesquelles les textes sont recherchés, si le texte n'est pas disponible dans la langue sélectionnée"

    assign_compatibility:
        type: str
        default: 'latest'
        valid_list: ['latest', 'compat_1.2']
        description:
            de: Wenn 'latest' gewählt wird, werden Werte bei der Zuweisung zu Items in den Datentyp des Items gewandelt, sonst werden sie als string zugewiesen
            en: If 'latest', values are castet to the datatype of the destination item, otherwise they are assigned as strings
            fr: Si 'latest' est sélectionné, les valeurs seront transformés vers le type de données de l'objet lors de l'attribution. Sinon ils seront assignés comme châines de caractères.

    use_conditional_triggers:
        type: bool
        gui_type: yes_no
        default: False
        description:
            de: 'Advanced: Verwendung konditionaler Trigger zulassen'
            en: 'Advanced: Allow use of conditional triggers'
            fr: "Avancé: Autoriser l'utilisation de déclencheurs conditionnels"

    deprecated_warnings:
        live: True
        type: bool
        default: False
        gui_type: yes_no
        description:
            de: 'Advanced: Warnungen loggen, wenn Funktionen/Methoden aufgerufen werden, die als veraltet gekennzeichnet sind'
            en: 'Advanced: Log warnings, if functions/methods are used which are flaged as deprecated'
            fr: "Avancé: Enregistrer les avertissements si des fonctions / méthodes sont utilisées qui sont affichées comme obsolètes"

    backup_name_stem:
        live: True
        # Stem for name of configuration backup files
        type: str
        description:
            de: "Falls mehrere Instanzen von SmartHomeNG gesichert werden sollen, kann es hilfreich sein, dem Namen der jeweiligen Sicherungsdatei einen Namens-Stamm voran zu stellen."
            en: "If backing up multiple instances of SmartHomeNG it can be useful to define a stem for the name of the backup file"

    allow_system_power:
        live: True
        type: bool
        gui_type: yes_no
        default: False
        description:
            de: "Erlaubt der AdminUI, den Rechner (Host) auszuschalten oder neu zu starten. Der Befehl wird mit den Rechten des SmartHomeNG-Benutzers ausgeführt, das Betriebssystem entscheidet über die Berechtigung."
            en: "Allow the AdminUI to power off or reboot the host. The command runs with the permissions of the SmartHomeNG user, the operating system decides whether it is permitted."

    holidays_country:
        type: str
        default: DE
        description:
            de: "Land dessen Feiertage berücksichtigt werden sollen (DE, AT, CH, FRA, LU, BE, PL, UK, ...)"
            en: "Country for holidays to be used (DE, AT, CH, FRA, LU, BE, PL, UK, ...)"

    holidays_province:
        type: str
        default: ""
        description:
            de: "Hier wird das Bundesland für die regionalen Feiertage festgelegt
                - für DE: BW, BY, BE, BB, HB, HH, HE, MV, NI, NW, RP, SL, SN, ST, SH, TH
                - für AT: B, K, N, O, S, ST, T, V, W (default)
                - für CH: AG, AR, AI, BL, BS, BE, FR, GE, GL, GR, JU, LU, NE, NW, OW, SG, SH, SZ, SO, TG, TI, UR, VD, VS, ZG, ZH
                - für FRA: Métropole (default), Alsace-Moselle, Guadeloupe, Guyane, Martinique, Mayotte, Nouvelle-Calédonie, La Réunion, Polynésie Française, Saint-Barthélémy, Saint-Martin, Wallis-et-Futuna
                "
            en: "Province to be used for regional holifays
                - for DE: BW, BY, BE, BB, HB, HH, HE, MV, NI, NW, RP, SL, SN, ST, SH, TH
                - for AT: B, K, N, O, S, ST, T, V, W (default)
                - for CH: AG, AR, AI, BL, BS, BE, FR, GE, GL, GR, JU, LU, NE, NW, OW, SG, SH, SZ, SO, TG, TI, UR, VD, VS, ZG, ZH
                - for FRA: Métropole (default), Alsace-Moselle, Guadeloupe, Guyane, Martinique, Mayotte, Nouvelle-Calédonie, La Réunion, Polynésie Française, Saint-Barthélémy, Saint-Martin, Wallis-et-Futuna
            "

    holidays_state:
        type: str
        default: ""
        description:
            de: "holiday_state wird nur für United States (CA, FL, NY, etc.) und Brazil verwendet"
            en: "holiday_state is only used for United States (CA, FL, NY, etc.) and Brazil"

    holidays_custom1:
        type: str
        gui_type: wide_str
        default: ""
        description:
            de: "Zur Verwendung bitte die Dokumentation konsultieren"
            en: "Please consult the user manual for information about usage"

    holidays_custom2:
        type: str
        gui_type: wide_str
        default: ""
        description:
            de: ""
            en: ""

    holidays_custom3:
        type: str
        gui_type: wide_str
        default: ""
        description:
            de: ""
            en: ""

    holidays_custom4:
        type: str
        gui_type: wide_str
        default: ""
        description:
            de: ""
            en: ""

    holidays_custom5:
        type: str
        gui_type: wide_str
        default: ""
        description:
            de: ""
            en: ""

    config_etc:
        type: bool
        gui_type: yes_no
        default: True
        description:
            de: "Konfigurationsverzeichnisse (items, logics, structs, scenes, functions) unterhalb von etc/ suchen. Vorhandene Verzeichnisse im Hauptverzeichnis werden beim Start automatisch dorthin verschoben. False verwendet die bis 1.12 übliche Struktur."
            en: "Look for config directories (items, logics, structs, scenes, functions) below etc/. Existing directories in the base directory are moved there on startup. False keeps the layout used up to 1.12."

    legacy_instances:
        type: bool
        gui_type: yes_no
        default: False
        description:
            de: "True: Instanznamen aus dem 'instance'-Parameter in plugin.yaml verwenden (Verhalten bis 1.12). False: der Name des Abschnitts in plugin.yaml ist der Instanzname"
            en: "True: use instance names from the 'instance' parameter in plugin.yaml (behaviour up to 1.12). False: the name of the section in plugin.yaml is the instance name"

    pip_command:
        live: True
        type: str
        description:
            de: "PIP-Befehl, falls pip3 nicht automatisch gefunden wird (z.B. 'python3 -m pip')"
            en: "PIP command to use if pip3 is not found automatically (e.g. 'python3 -m pip')"

    db_query_timeout:
        live: True
        type: num
        default: 60
        description:
            de: "Timeout in Sekunden für Datenbankabfragen (z.B. MySQL). Verhindert dauerhaftes Blockieren bei einem nicht erreichbaren Datenbankserver. Gilt auch als Lock-Timeout beim Schließen der Verbindung."
            en: "Timeout in seconds for database queries (e.g. MySQL). Prevents indefinite blocking when the database server is unresponsive. Also used as the lock-acquisition timeout when closing the connection."

    runtime_warn:
        live: True
        type: num
        default: 120
        valid_min: 0
        description:
            de: "Laufzeit in Sekunden, ab der für einen Scheduler-Task (Logik, Item-Zyklus/Crontab, Plugin-Scheduler) eine Warnung mit Stacktrace geloggt wird, erneut bei jeder Verdopplung. 0 = aus. Logiken können den Wert mit ihrem eigenen Parameter runtime_warn überschreiben."
            en: "Runtime in seconds after which a warning with stack trace is logged for a scheduler task (logic, item cycle/crontab, plugin scheduler), again at each doubling. 0 = off. Logics can override it with their own runtime_warn parameter."

    orb_backend:
        type: str
        default: ephem
        valid_list: ['ephem', 'skyfield', 'skyfield-cached']
        description:
            de: "Advanced: Bibliothek für die Berechnung von Sonne und Mond (sh.sun, sh.moon). Ist sie nicht installiert, wird mit einer Warnung ein installiertes Backend verwendet."
            en: "Advanced: Library used to calculate sun and moon (sh.sun, sh.moon). If it is not installed, an installed backend is used and a warning is logged."

    sun_neverup_delta:
        type: num
        default: 0.00001
        description:
            de: "Advanced: Korrektur in Grad, um die Sonnenauf- und -untergänge nahe der Polartage und -nächte zu berechnen"
            en: "Advanced: Correction in degrees to calculate sunrise and sunset close to polar days and nights"

    default_logtext:
        type: str
        description:
            de: "Standard-Text für Logeinträge des Item-Attributs log_change, wenn das Item kein log_text hat (Platzhalter siehe Dokumentation von log_change)"
            en: "Default text for log entries of the item attribute log_change if the item has no log_text (see the documentation of log_change for placeholders)"

    created_items_file:
        type: str
        default: created
        description:
            de: "Advanced: Name der Datei in etc/items (ohne .yaml), in die zur Laufzeit erzeugte Items geschrieben werden, wenn kein Dateiname angegeben ist"
            en: "Advanced: Name of the file in etc/items (without .yaml) that items created at runtime are written to if no file name is given"

    ignore_item_collision:
        type: bool
        gui_type: yes_no
        default: False
        description:
            de: "Advanced: Items, deren Name mit einem Attribut des übergeordneten Objekts kollidiert, mit einer Warnung trotzdem anlegen, statt sie zu verwerfen"
            en: "Advanced: Create items whose name collides with an attribute of the parent object with a warning, instead of dropping them"

    restart_on_num_workers:
        live: True
        type: int
        default: 30
        valid_min: 1
        description:
            de: "Advanced: SmartHomeNG wird neu gestartet, wenn der Scheduler so viele Worker-Threads benötigt"
            en: "Advanced: SmartHomeNG restarts if the scheduler needs this many worker threads"

    shpypi_crontab:
        type: str
        default: '7 3 * *'
        description:
            de: "Advanced: Crontab-Eintrag für die Abfrage der Paket-Versionen auf PyPI"
            en: "Advanced: Crontab entry for querying package versions on PyPI"

    module_paths:
        type: list(str)
        description:
            de: "Advanced: Zusätzliche Verzeichnisse für Python-Module (werden sys.path hinzugefügt, normalerweise nicht nötig)"
            en: "Advanced: Additional directories for Python modules (added to sys.path, normally not needed)"

    threadinfo_export:
        type: bool
        gui_type: yes_no
        default: False
        description:
            de: "Develop: Alle 120 Sekunden Informationen zu den Threads für das Tool tools/cpuusage.py exportieren"
            en: "Develop: Export information about the threads every 120 seconds for the tool tools/cpuusage.py"
