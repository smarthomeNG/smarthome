<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="Helvetica, Arial, sans-serif">
  <rect width="760" height="420" fill="#f9f9f9"/>

  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L8,3.5 z" fill="#555"/>
    </marker>
  </defs>

  <text x="380" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">Age-Based Cleanup — database_maxage_action</text>

  <!-- time axis -->
  <line x1="60" y1="150" x2="700" y2="150" stroke="#aaa" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="705" y="154" font-size="11" fill="#888">time</text>

  <!-- cutoff marker -->
  <line x1="380" y1="110" x2="380" y2="190" stroke="#d93025" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="380" y="105" text-anchor="middle" font-size="10" font-weight="bold" fill="#d93025">database_maxage cutoff</text>

  <!-- recent data, kept raw -->
  <rect x="380" y="130" width="280" height="40" rx="3" fill="#34a853" opacity="0.8"/>
  <text x="520" y="154" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">recent — kept as raw rows</text>

  <!-- old data, eligible for cleanup -->
  <rect x="60" y="130" width="320" height="40" rx="3" fill="#e8eaed" stroke="#999" stroke-width="1"/>
  <text x="220" y="154" text-anchor="middle" font-size="10" fill="#555">older than maxage — eligible for cleanup</text>

  <!-- two branches -->
  <line x1="150" y1="170" x2="150" y2="210" stroke="#888" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="290" y1="170" x2="290" y2="210" stroke="#888" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="220" y="195" text-anchor="middle" font-size="11" font-weight="bold" fill="#888">database_maxage_action</text>

  <!-- 'delete' branch -->
  <rect x="60" y="215" width="180" height="60" rx="5" fill="#fce8e6" stroke="#d93025" stroke-width="1.5"/>
  <text x="150" y="236" text-anchor="middle" font-size="11" font-weight="bold" fill="#b31412">'delete' (default)</text>
  <text x="150" y="252" text-anchor="middle" font-size="9" fill="#555">removed outright, in</text>
  <text x="150" y="266" text-anchor="middle" font-size="9" fill="#555">max_delete_logentries batches</text>

  <!-- 'compact' branch -->
  <rect x="260" y="215" width="240" height="60" rx="5" fill="#e8f0fe" stroke="#4a86e8" stroke-width="1.5"/>
  <text x="380" y="236" text-anchor="middle" font-size="11" font-weight="bold" fill="#2a5db0">sum/avg/min/max/integrate/on/</text>
  <text x="380" y="250" text-anchor="middle" font-size="10" font-weight="bold" fill="#2a5db0">countall/first/last</text>
  <text x="380" y="266" text-anchor="middle" font-size="9" fill="#555">one aggregate row per database_maxage_interval</text>

  <!-- compaction detail -->
  <rect x="60" y="300" width="640" height="100" rx="5" fill="#fff" stroke="#4a86e8" stroke-width="1.2"/>
  <text x="380" y="320" text-anchor="middle" font-size="10" font-weight="bold" fill="#2a5db0">_compact_maxage() — one interval bucket at a time, oldest first, no persisted resume cursor</text>
  <text x="380" y="338" text-anchor="middle" font-size="9" fill="#555">Same transaction(): compute aggregate/edge value over the interval (gap rows excluded) → delete raw rows → insert the one aggregate row.</text>
  <text x="380" y="354" text-anchor="middle" font-size="9" fill="#555">Delete happens before insert — the aggregate's timestamp is the interval start, which a raw row may legally already occupy.</text>
  <text x="380" y="372" text-anchor="middle" font-size="9" fill="#b31412">If the aggregate expression yields no value but the interval still holds valid rows (e.g. every duration is NULL —</text>
  <text x="380" y="386" text-anchor="middle" font-size="9" fill="#b31412">a crash-orphaned entry), the interval is left raw and a warning is logged, instead of silently destroying that data.</text>
</svg>
