<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 1227" font-family="Helvetica, Arial, sans-serif">
  <rect width="940" height="1227" fill="#f9f9f9"/>

  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L9,3.5 z" fill="#555"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L9,3.5 z" fill="#d93025"/>
    </marker>
  </defs>

  <text x="470.0" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">Dump Cycle — _dump() (scheduler, every `cycle` seconds, default 60)</text>
  <rect x="200.0" y="44" width="420" height="32" rx="5" fill="#e8f0fe" stroke="#4a86e8" stroke-width="1.5"/>
  <text x="410.0" y="63.5" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2a5db0">Acquire self._dump_lock (timeout=60s)</text>
  <line x1="410.0" y1="76" x2="410.0" y2="100" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="620.0" y1="60.0" x2="750" y2="60.0" stroke="#d93025" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <rect x="750" y="44" width="170" height="73" rx="5" fill="#fce8e6" stroke="#d93025" stroke-width="1.5"/>
  <text x="835.0" y="62" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#b31412">lock busy</text>
  <text x="835.0" y="77" text-anchor="middle" font-size="8.5" fill="#555">skipping_dump=True</text>
  <text x="835.0" y="91" text-anchor="middle" font-size="8.5" fill="#555">buffered for next cycle</text>
  <rect x="190.0" y="100" width="440" height="32" rx="5" fill="#e8f0fe" stroke="#4a86e8" stroke-width="1.5"/>
  <text x="410.0" y="119.5" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2a5db0">_initialize_db()  — self-healing reconnect</text>
  <line x1="410.0" y1="132" x2="410.0" y2="156" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="630.0" y1="116.0" x2="750" y2="116.0" stroke="#d93025" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <rect x="750" y="100" width="170" height="59" rx="5" fill="#e8eaed" stroke="#999999" stroke-width="1.5"/>
  <text x="835.0" y="118" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#555555">not connected</text>
  <text x="835.0" y="133" text-anchor="middle" font-size="8.5" fill="#555">release lock, return</text>
  <rect x="130.0" y="156" width="560" height="32" rx="5" fill="#e8eaed" stroke="#999999" stroke-width="1.5"/>
  <text x="410.0" y="175.33333333333334" text-anchor="middle" font-size="10" font-weight="bold" fill="#555555">if not self._orphanlist_built: retry build_orphanlist()</text>
  <line x1="410.0" y1="188" x2="410.0" y2="212" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="160.0" y="212" width="500" height="32" rx="5" fill="#e8f0fe" stroke="#4a86e8" stroke-width="1.5"/>
  <text x="410.0" y="231.5" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2a5db0">items = self._buffer_mgr.items()  (or an explicit list)</text>
  <line x1="410.0" y1="244" x2="410.0" y2="268" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="190.0" y="268" width="440" height="32" rx="5" fill="#fef7e0" stroke="#f9ab00" stroke-width="1.5"/>
  <text x="410.0" y="287.5" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#9c6e00">for each item with pending entries:</text>
  <line x1="410.0" y1="300" x2="410.0" y2="324" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="160.0" y="324" width="500" height="32" rx="5" fill="#e8f0fe" stroke="#4a86e8" stroke-width="1.5"/>
  <text x="410.0" y="343.5" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2a5db0">entries = self._buffer_mgr.pop_all(item)</text>
  <line x1="410.0" y1="356" x2="410.0" y2="380" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="190.0" y="380" width="440" height="32" rx="5" fill="#fef7e0" stroke="#f9ab00" stroke-width="1.5"/>
  <text x="410.0" y="399.5" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#9c6e00">self._db.verify(2) == 0  (connectivity probe)?</text>
  <line x1="410.0" y1="412" x2="410.0" y2="436" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="630.0" y1="396.0" x2="690" y2="396.0" stroke="#d93025" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <rect x="690" y="370" width="230" height="87" rx="5" fill="#fce8e6" stroke="#d93025" stroke-width="1.5"/>
  <text x="805.0" y="388" text-anchor="middle" font-size="9" font-weight="bold" fill="#b31412">connection not recovered</text>
  <text x="805.0" y="403" text-anchor="middle" font-size="8" fill="#555">restore(item, entries)</text>
  <text x="805.0" y="417" text-anchor="middle" font-size="8" fill="#555">release lock, return</text>
  <text x="805.0" y="431" text-anchor="middle" font-size="8" fill="#555">(whole method aborts, not just this item)</text>
  <rect x="40.0" y="436" width="740" height="512" rx="5" fill="none" stroke="#4a86e8" stroke-width="1.5"/>
  <rect x="170.0" y="436" width="480" height="32" rx="5" fill="#ffffff" stroke="#4a86e8" stroke-width="1.5"/>
  <text x="410.0" y="455.8333333333333" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2a5db0">with self._db.transaction(timeout=300) as cur:  — one transaction per item</text>
  <line x1="410.0" y1="468" x2="410.0" y2="484" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="190.0" y="484" width="440" height="59" rx="5" fill="#e8f0fe" stroke="#4a86e8" stroke-width="1.5"/>
  <text x="410.0" y="502" text-anchor="middle" font-size="10" font-weight="bold" fill="#2a5db0">Read current item state</text>
  <text x="410.0" y="517" text-anchor="middle" font-size="9" fill="#555">changed=now(); start=last_change(); val=item()</text>
  <line x1="410.0" y1="543" x2="410.0" y2="567" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="190.0" y="567" width="440" height="87" rx="5" fill="#fef7e0" stroke="#f9ab00" stroke-width="1.5"/>
  <text x="410.0" y="585" text-anchor="middle" font-size="10" font-weight="bold" fill="#9c6e00">finalize=True (shutdown)?</text>
  <text x="410.0" y="600" text-anchor="middle" font-size="8.5" fill="#555">database_write_on_shutdown (default True):</text>
  <text x="410.0" y="614" text-anchor="middle" font-size="8.5" fill="#555">False → _update=(start,val,changed), no extra entry</text>
  <text x="410.0" y="628" text-anchor="middle" font-size="8.5" fill="#555">True  → _update=(end,val,changed), append current entry</text>
  <line x1="410.0" y1="654" x2="410.0" y2="678" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="190.0" y="678" width="440" height="32" rx="5" fill="#e8f0fe" stroke="#4a86e8" stroke-width="1.5"/>
  <text x="410.0" y="697.3333333333334" text-anchor="middle" font-size="10" font-weight="bold" fill="#2a5db0">else: _update = (start, val, changed)</text>
  <line x1="410.0" y1="710" x2="410.0" y2="734" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="190.0" y="734" width="440" height="59" rx="5" fill="#e8f0fe" stroke="#4a86e8" stroke-width="1.5"/>
  <text x="410.0" y="752" text-anchor="middle" font-size="10" font-weight="bold" fill="#2a5db0">id = self.id(item, cur=cur)</text>
  <text x="410.0" y="767" text-anchor="middle" font-size="9" fill="#555">looks up / creates the item row</text>
  <line x1="410.0" y1="793" x2="410.0" y2="817" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="190.0" y="817" width="440" height="32" rx="5" fill="#e6f4ea" stroke="#34a853" stroke-width="1.5"/>
  <text x="410.0" y="836.3333333333334" text-anchor="middle" font-size="10" font-weight="bold" fill="#1e7e34">for entry in entries: LogStore.upsert(id, entry, item.type(), changed, cur=cur)</text>
  <line x1="410.0" y1="849" x2="410.0" y2="873" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="190.0" y="873" width="440" height="59" rx="5" fill="#e6f4ea" stroke="#34a853" stroke-width="1.5"/>
  <text x="410.0" y="891" text-anchor="middle" font-size="10" font-weight="bold" fill="#1e7e34">self.updateItem(id, *_update, cur=cur)</text>
  <text x="410.0" y="906" text-anchor="middle" font-size="9" fill="#555">refreshes the item-table latest-value snapshot</text>
  <line x1="410.0" y1="932" x2="410.0" y2="948" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="-30.0" y="972" width="400" height="32" rx="5" fill="#fce8e6" stroke="#d93025" stroke-width="1.5"/>
  <text x="170.0" y="991.5" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b31412">except TimeoutError</text>
  <line x1="170.0" y1="1004" x2="170.0" y2="1020" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="-30.0" y="1020" width="400" height="101" rx="5" fill="#fce8e6" stroke="#d93025" stroke-width="1.5"/>
  <text x="170.0" y="1038" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#b31412"></text>
  <text x="170.0" y="1053" text-anchor="middle" font-size="8.5" fill="#555">restore(item, entries)</text>
  <text x="170.0" y="1067" text-anchor="middle" font-size="8.5" fill="#555">finalize=True → error log, else → warning</text>
  <text x="170.0" y="1081" text-anchor="middle" font-size="8.5" fill="#555">release self._dump_lock, return</text>
  <text x="170.0" y="1095" text-anchor="middle" font-size="8.5" fill="#555">(the WHOLE method aborts, not just this item)</text>
  <rect x="450.0" y="972" width="400" height="32" rx="5" fill="#fce8e6" stroke="#d93025" stroke-width="1.5"/>
  <text x="650.0" y="991.5" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b31412">except Exception</text>
  <line x1="650.0" y1="1004" x2="650.0" y2="1020" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="450.0" y="1020" width="400" height="87" rx="5" fill="#e8eaed" stroke="#999999" stroke-width="1.5"/>
  <text x="650.0" y="1038" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#555555"></text>
  <text x="650.0" y="1053" text-anchor="middle" font-size="8.5" fill="#555">is_connection_error(e) → warn, retry next dump</text>
  <text x="650.0" y="1067" text-anchor="middle" font-size="8.5" fill="#555">other → warn, with traceback</text>
  <text x="650.0" y="1081" text-anchor="middle" font-size="8.5" fill="#555">restore(item, entries)  — loop continues to next item</text>
  <line x1="170.0" y1="948" x2="170.0" y2="972" stroke="#555" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr)"/>
  <text x="110.0" y="966" font-size="9" fill="#888">on failure</text>
  <line x1="650.0" y1="948" x2="650.0" y2="972" stroke="#555" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr)"/>
  <text x="658.0" y="966" font-size="9" fill="#888">on failure</text>
  <line x1="170.0" y1="1121" x2="410.0" y2="1155" stroke="#555" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr)"/>
  <line x1="650.0" y1="1107" x2="410.0" y2="1155" stroke="#555" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr)"/>
  <text x="410.0" y="1137" text-anchor="middle" font-size="9" fill="#888">loop over the remaining items continues either way (except the TimeoutError abort)</text>
  <rect x="190.0" y="1165" width="440" height="32" rx="5" fill="#e6f4ea" stroke="#34a853" stroke-width="1.5"/>
  <text x="410.0" y="1184.5" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1e7e34">loop ends: release self._dump_lock</text>
</svg>
