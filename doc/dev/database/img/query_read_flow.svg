<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 572" font-family="Helvetica, Arial, sans-serif">
  <rect width="1400" height="572" fill="#f9f9f9"/>

  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L9,3.5 z" fill="#555"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L9,3.5 z" fill="#d93025"/>
    </marker>
  </defs>

  <text x="700.0" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">On-Demand Query — _series() / _single() / readLogCount() native-cagg routing</text>
  <rect x="320.0" y="44" width="760" height="59" rx="5" fill="#e8f0fe" stroke="#4a86e8" stroke-width="1.5"/>
  <text x="700.0" y="62" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2a5db0">Caller requests data for an item + time range</text>
  <text x="700.0" y="77" text-anchor="middle" font-size="9" fill="#555">websocket plugin (_series() for a visu chart) or a logic (_single()/readLogCount())</text>
  <line x1="700.0" y1="103" x2="700.0" y2="127" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="350.0" y="127" width="700" height="59" rx="5" fill="#fef7e0" stroke="#f9ab00" stroke-width="1.5"/>
  <text x="700.0" y="145" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#9c6e00">_native_cagg_view(item) — does timescale_native_aggregation cover this item?</text>
  <text x="700.0" y="160" text-anchor="middle" font-size="9" fill="#555">(native mode, psycopg driver, a cagg exists for its database_maxage_interval)</text>
  <line x1="700.0" y1="186" x2="700.0" y2="210" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="1050.0" y1="156.5" x2="1080" y2="156.5" stroke="#d93025" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <rect x="1080" y="121" width="260" height="73" rx="5" fill="#e8eaed" stroke="#999999" stroke-width="1.5"/>
  <text x="1210.0" y="139" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#555555">no cagg for this item</text>
  <text x="1210.0" y="154" text-anchor="middle" font-size="8.5" fill="#555">every function below queries</text>
  <text x="1210.0" y="168" text-anchor="middle" font-size="8.5" fill="#555">the raw {log} table only</text>
  <rect x="80.0" y="210" width="400" height="26" rx="5" fill="#e8f0fe" stroke="#4a86e8" stroke-width="1.5"/>
  <text x="280.0" y="226.66666666666666" text-anchor="middle" font-size="11" font-weight="bold" fill="#2a5db0">_series()</text>
  <rect x="500.0" y="210" width="400" height="26" rx="5" fill="#e8f0fe" stroke="#4a86e8" stroke-width="1.5"/>
  <text x="700.0" y="226.66666666666666" text-anchor="middle" font-size="11" font-weight="bold" fill="#2a5db0">_single()</text>
  <rect x="920.0" y="210" width="400" height="26" rx="5" fill="#e8f0fe" stroke="#4a86e8" stroke-width="1.5"/>
  <text x="1120.0" y="226.66666666666666" text-anchor="middle" font-size="11" font-weight="bold" fill="#2a5db0">readLogCount()</text>
  <rect x="80.0" y="252" width="400" height="101" rx="5" fill="#e6f4ea" stroke="#34a853" stroke-width="1.5"/>
  <text x="280.0" y="270" text-anchor="middle" font-size="10" font-weight="bold" fill="#1e7e34">merge: raw + cagg prefix</text>
  <text x="280.0" y="285" text-anchor="middle" font-size="8.5" fill="#555">Always queries the full raw range via _fetch_log().</text>
  <text x="280.0" y="299" text-anchor="middle" font-size="8.5" fill="#555">ALSO calls _native_cagg_series(func, istart, min(iend,oldest), step, item)</text>
  <text x="280.0" y="313" text-anchor="middle" font-size="8.5" fill="#555">for whatever portion of the range predates the raw floor.</text>
  <text x="280.0" y="327" text-anchor="middle" font-size="8.5" fill="#555">Non-None result → prepended to the raw tuples (MERGE, re-bucketed to the same step).</text>
  <rect x="500.0" y="252" width="400" height="101" rx="5" fill="#fef7e0" stroke="#f9ab00" stroke-width="1.5"/>
  <text x="700.0" y="270" text-anchor="middle" font-size="10" font-weight="bold" fill="#9c6e00">exclusive: cagg OR raw, never both</text>
  <text x="700.0" y="285" text-anchor="middle" font-size="8.5" fill="#555">_native_cagg_single(func, start, end, item):</text>
  <text x="700.0" y="299" text-anchor="middle" font-size="8.5" fill="#555">entire [start,end) predates oldest raw row → cagg-only result, return early.</text>
  <text x="700.0" y="313" text-anchor="middle" font-size="8.5" fill="#555">Any overlap with still-raw territory → returns None,</text>
  <text x="700.0" y="327" text-anchor="middle" font-size="8.5" fill="#555">caller falls through to the normal precise raw-log query instead (NOT a merge).</text>
  <rect x="920.0" y="252" width="400" height="101" rx="5" fill="#e6f4ea" stroke="#34a853" stroke-width="1.5"/>
  <text x="1120.0" y="270" text-anchor="middle" font-size="10" font-weight="bold" fill="#1e7e34">additive: raw + cagg counts</text>
  <text x="1120.0" y="285" text-anchor="middle" font-size="8.5" fill="#555">if _timescale_native_aggregation:</text>
  <text x="1120.0" y="299" text-anchor="middle" font-size="8.5" fill="#555">cagg_count = _native_cagg_count(item, id, time_start, time_end)</text>
  <text x="1120.0" y="313" text-anchor="middle" font-size="8.5" fill="#555">result = raw_count + (cagg_count or 0)  — plain addition,</text>
  <text x="1120.0" y="327" text-anchor="middle" font-size="8.5" fill="#555">the two ranges never overlap by construction.</text>
  <line x1="280.0" y1="353" x2="700.0" y2="387" stroke="#555" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr)"/>
  <line x1="700.0" y1="353" x2="700.0" y2="387" stroke="#555" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr)"/>
  <line x1="1120.0" y1="353" x2="700.0" y2="387" stroke="#555" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr)"/>
  <rect x="400.0" y="393" width="600" height="32" rx="5" fill="#e8eaed" stroke="#999999" stroke-width="1.5"/>
  <text x="700.0" y="412.5" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#555555">Result returned to the caller</text>
  <line x1="700.0" y1="425" x2="700.0" y2="425" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="80.0" y="445" width="1240" height="87" rx="5" fill="#ffffff" stroke="#4a86e8" stroke-width="1.5"/>
  <text x="700.0" y="463" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#2a5db0"></text>
  <text x="700.0" y="478" text-anchor="middle" font-size="9.5" fill="#555">Why the difference: _series() needs a continuous line across the raw/cagg boundary for a chart, so it stitches;</text>
  <text x="700.0" y="492" text-anchor="middle" font-size="9.5" fill="#555">_single() only ever needs one number and the boundary case is narrow enough to keep the two paths cleanly separate;</text>
  <text x="700.0" y="506" text-anchor="middle" font-size="9.5" fill="#555">readLogCount() sums two disjoint counts, which is safe unconditionally — no boundary-straddling case exists for a count.</text>
</svg>
