<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 861" font-family="Helvetica, Arial, sans-serif">
  <rect width="1200" height="861" fill="#f9f9f9"/>

  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L9,3.5 z" fill="#555"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L9,3.5 z" fill="#d93025"/>
    </marker>
  </defs>

  <text x="600.0" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">Data Invalidity — No-Data Gaps</text>
  <rect x="130.0" y="44" width="340" height="59" rx="5" fill="#e8f0fe" stroke="#4a86e8" stroke-width="1.5"/>
  <text x="300.0" y="62" text-anchor="middle" font-size="10" font-weight="bold" fill="#2a5db0">item.db_mark_invalid(caller, source)</text>
  <text x="300.0" y="77" text-anchor="middle" font-size="8.5" fill="#555">injected onto every registered item</text>
  <line x1="300.0" y1="103" x2="300.0" y2="103" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="730.0" y="44" width="340" height="59" rx="5" fill="#e8f0fe" stroke="#4a86e8" stroke-width="1.5"/>
  <text x="900.0" y="62" text-anchor="middle" font-size="10" font-weight="bold" fill="#2a5db0">item.db_mark_valid(caller, source)</text>
  <text x="900.0" y="77" text-anchor="middle" font-size="8.5" fill="#555">injected onto every registered item</text>
  <line x1="900.0" y1="103" x2="900.0" y2="103" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="430.0" y="44" width="340" height="59" rx="5" fill="#fef7e0" stroke="#f9ab00" stroke-width="1.5"/>
  <text x="600.0" y="62" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#9c6e00">update_item(): reactive invalid_after check</text>
  <text x="600.0" y="77" text-anchor="middle" font-size="8.5" fill="#555">last_update − prev_update &gt; threshold?</text>
  <line x1="600.0" y1="103" x2="600.0" y2="103" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="300.0" y1="103" x2="300.0" y2="109" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="900.0" y1="103" x2="900.0" y2="109" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="600.0" y1="103" x2="600.0" y2="109" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="220.0" y="123" width="760" height="59" rx="5" fill="#ffffff" stroke="#4a86e8" stroke-width="1.5"/>
  <text x="600.0" y="141" text-anchor="middle" font-size="11" font-weight="bold" fill="#2a5db0">_mark_item_invalid(item, caller, at=None)</text>
  <text x="600.0" y="156" text-anchor="middle" font-size="9" fill="#555">start_ts = now(), or the caller-supplied provable boundary (at=)</text>
  <line x1="600.0" y1="182" x2="600.0" y2="206" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="290.0" y="206" width="620" height="59" rx="5" fill="#e6f4ea" stroke="#34a853" stroke-width="1.5"/>
  <text x="600.0" y="224" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1e7e34">BufferManager.push_invalid(item, start_ts)</text>
  <text x="600.0" y="239" text-anchor="middle" font-size="9" fill="#555">closes any open valid entry, appends open QUALITY_NO_DATA entry</text>
  <line x1="600.0" y1="265" x2="600.0" y2="289" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="250.0" y="299" width="700" height="32" rx="5" fill="#ffffff" stroke="#4a86e8" stroke-width="1.5"/>
  <text x="600.0" y="318.5" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2a5db0">_mark_item_valid(item, caller)  — or an implicit close inside update_item()</text>
  <line x1="600.0" y1="331" x2="600.0" y2="355" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="350.0" y="355" width="500" height="32" rx="5" fill="#fef7e0" stroke="#f9ab00" stroke-width="1.5"/>
  <text x="600.0" y="374.5" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#9c6e00">last entry open &amp; QUALITY_NO_DATA?</text>
  <line x1="600.0" y1="387" x2="600.0" y2="387" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="850.0" y1="371.0" x2="920" y2="371.0" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="920" y="341.5" width="220" height="59" rx="5" fill="#e8eaed" stroke="#999999" stroke-width="1.5"/>
  <text x="1030.0" y="359.5" text-anchor="middle" font-size="9" font-weight="bold" fill="#555555">no</text>
  <text x="1030.0" y="374.5" text-anchor="middle" font-size="8.5" fill="#555">nothing to close — no-op</text>
  <line x1="600.0" y1="387" x2="600.0" y2="411" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="290.0" y="411" width="620" height="59" rx="5" fill="#e6f4ea" stroke="#34a853" stroke-width="1.5"/>
  <text x="600.0" y="429" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1e7e34">BufferManager.close_open(item, end_ts)</text>
  <text x="600.0" y="444" text-anchor="middle" font-size="9" fill="#555">back-fills the gap entry's duration from ITS OWN start (not prev_change())</text>
  <line x1="600.0" y1="470" x2="600.0" y2="494" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="220.0" y="510" width="760" height="59" rx="5" fill="#e8eaed" stroke="#999999" stroke-width="1.5"/>
  <text x="600.0" y="528" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#555555">Stored as val_quality=QUALITY_NO_DATA (schema v7)</text>
  <text x="600.0" y="543" text-anchor="middle" font-size="9" fill="#555">NULL val_str/val_num/val_bool — no real value was recorded</text>
  <rect x="140.0" y="589" width="920" height="115" rx="5" fill="#ffffff" stroke="#4a86e8" stroke-width="1.5"/>
  <text x="600.0" y="607" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#2a5db0"></text>
  <text x="600.0" y="622" text-anchor="middle" font-size="9.5" fill="#555">Reactive vs. scheduled detection — two independent paths reach _mark_item_invalid():</text>
  <text x="600.0" y="636" text-anchor="middle" font-size="9.5" fill="#555">• update_item(): fires only when a NEXT update finally arrives — catches recovery immediately.</text>
  <text x="600.0" y="650" text-anchor="middle" font-size="9.5" fill="#555">• _check_invalid_items() (scheduler, every invalid_check_cycle s): the only path that catches an item</text>
  <text x="600.0" y="664" text-anchor="middle" font-size="9.5" fill="#555">  still silent right now, with no update in sight. Waits invalid_check_grace_time after startup per item</text>
  <text x="600.0" y="678" text-anchor="middle" font-size="9.5" fill="#555">  (database:init can restore a stale last_update()) before judging it, and skips items with a gap already open.</text>
  <rect x="140.0" y="720" width="920" height="101" rx="5" fill="#e8f0fe" stroke="#4a86e8" stroke-width="1.5"/>
  <text x="600.0" y="738" text-anchor="middle" font-size="10" font-weight="bold" fill="#2a5db0">utils.build_where_clause(..., exclude_gaps=...) — filtering gaps out of queries</text>
  <text x="600.0" y="753" text-anchor="middle" font-size="9.5" fill="#555">On-demand analytics (_series()/_single()): always exclude gap rows unconditionally.</text>
  <text x="600.0" y="767" text-anchor="middle" font-size="9.5" fill="#555">Compaction (_compact_maxage()): passes exclude_gaps=True explicitly — same reason.</text>
  <text x="600.0" y="781" text-anchor="middle" font-size="9.5" fill="#555">Raw row management (delete_range()/find_range()/count()): does NOT exclude gaps —</text>
  <text x="600.0" y="795" text-anchor="middle" font-size="9.5" fill="#555">  a gap marker is still a real row to be counted/cleaned up like any other.</text>
</svg>
