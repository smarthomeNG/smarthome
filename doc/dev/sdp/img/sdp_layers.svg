<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1020" font-family="Helvetica, Arial, sans-serif">
  <rect width="1000" height="1020" fill="#f9f9f9"/>
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L0,7 L9,3.5 z" fill="#555"/></marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L0,7 L9,3.5 z" fill="#2a5db0"/></marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L0,7 L9,3.5 z" fill="#1e7e34"/></marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L0,7 L9,3.5 z" fill="#d93025"/></marker>
    <marker id="arr-purple" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L0,7 L9,3.5 z" fill="#681da8"/></marker>
    <marker id="arr-yellow" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L0,7 L9,3.5 z" fill="#9c6e00"/></marker>
  </defs>
  <text x="500" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">SDP layers — calls and data at every interface</text>
  <rect x="330" y="50" width="340" height="50" rx="5" fill="#f1f3f4" stroke="#9aa0a6" stroke-width="1.5"/>
  <text x="500" y="72" text-anchor="middle" font-size="11" font-weight="bold" fill="#3c4043">SmartHomeNG</text>
  <text x="500" y="86" text-anchor="middle" font-size="10" font-weight="normal" fill="#555">Item  ·  scheduler</text>
  <path d="M430,100 L430,168" fill="none" stroke="#1e7e34" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <text x="422" y="126" text-anchor="end" font-size="9" font-weight="normal" fill="#1e7e34" font-style="italic">update_item(item, caller, source, dest)</text>
  <text x="422" y="138" text-anchor="end" font-size="9" font-weight="normal" fill="#1e7e34" font-style="italic">value = item()</text>
  <path d="M570,168 L570,102" fill="none" stroke="#2a5db0" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="578" y="126" text-anchor="start" font-size="9" font-weight="normal" fill="#2a5db0" font-style="italic">item(value, caller=plugin)</text>
  <text x="578" y="138" text-anchor="start" font-size="9" font-weight="normal" fill="#2a5db0" font-style="italic">(from dispatch_data)</text>
  <rect x="40" y="170" width="920" height="92" rx="5" fill="#e8f0fe" stroke="#4a86e8" stroke-width="1.5"/>
  <text x="500" y="190" text-anchor="middle" font-size="11" font-weight="bold" fill="#2a5db0">SmartDevicePlugin  +  device subclass</text>
  <text x="60" y="216" text-anchor="start" font-size="10" font-weight="bold" fill="#1e7e34">send:</text>
  <text x="110" y="216" text-anchor="start" font-size="10" font-weight="normal" fill="#555">_write_item → send_command(command, value) → _do_before_send → get_send_data → _transform_send_data → send(data_dict)</text>
  <text x="60" y="240" text-anchor="start" font-size="10" font-weight="bold" fill="#2a5db0">receive:</text>
  <text x="120" y="240" text-anchor="start" font-size="10" font-weight="normal" fill="#555">on_data_received(by, data) → _transform_received_data → get_commands_from_reply → get_shng_data → dispatch_data(command, value)</text>
  <path d="M60,262 L60,348" fill="none" stroke="#1e7e34" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <text x="68" y="290" text-anchor="start" font-size="9" font-weight="normal" fill="#1e7e34" font-style="italic">get_send_data(command, value)</text>
  <text x="68" y="302" text-anchor="start" font-size="9" font-weight="normal" fill="#1e7e34" font-style="italic">→ data_dict</text>
  <path d="M250,262 L250,348" fill="none" stroke="#2a5db0" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="258" y="284" text-anchor="start" font-size="9" font-weight="normal" fill="#2a5db0" font-style="italic">get_commands_from_reply(data)</text>
  <text x="258" y="296" text-anchor="start" font-size="9" font-weight="normal" fill="#2a5db0" font-style="italic">→ [command, …]</text>
  <text x="258" y="308" text-anchor="start" font-size="9" font-weight="normal" fill="#2a5db0" font-style="italic">get_shng_data(command, data)</text>
  <text x="258" y="320" text-anchor="start" font-size="9" font-weight="normal" fill="#2a5db0" font-style="italic">→ value</text>
  <rect x="40" y="350" width="380" height="50" rx="5" fill="#fef7e0" stroke="#f9ab00" stroke-width="1.5"/>
  <text x="230" y="372" text-anchor="middle" font-size="11" font-weight="bold" fill="#9c6e00">SDPCommands</text>
  <text x="230" y="386" text-anchor="middle" font-size="9" font-weight="normal" fill="#555">registry from commands.py · lookups · reply routing</text>
  <path d="M60,400 L60,488" fill="none" stroke="#1e7e34" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <text x="68" y="424" text-anchor="start" font-size="9" font-weight="normal" fill="#1e7e34" font-style="italic">reverse lookup: value → device value</text>
  <text x="68" y="436" text-anchor="start" font-size="9" font-weight="normal" fill="#1e7e34" font-style="italic">SDPCommand.get_send_data(value)</text>
  <text x="68" y="448" text-anchor="start" font-size="9" font-weight="normal" fill="#1e7e34" font-style="italic">→ data_dict {payload, data}</text>
  <path d="M250,400 L250,488" fill="none" stroke="#2a5db0" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="258" y="424" text-anchor="start" font-size="9" font-weight="normal" fill="#2a5db0" font-style="italic">SDPCommand.get_shng_data(data)</text>
  <text x="258" y="436" text-anchor="start" font-size="9" font-weight="normal" fill="#2a5db0" font-style="italic">→ value</text>
  <text x="258" y="448" text-anchor="start" font-size="9" font-weight="normal" fill="#2a5db0" font-style="italic">then forward lookup</text>
  <rect x="40" y="490" width="380" height="50" rx="5" fill="#fef7e0" stroke="#f9ab00" stroke-width="1.5"/>
  <text x="230" y="512" text-anchor="middle" font-size="11" font-weight="bold" fill="#9c6e00">SDPCommand  (Str / ParseStr / JSON / …)</text>
  <text x="230" y="526" text-anchor="middle" font-size="9" font-weight="normal" fill="#555">_check_value · payload string · reply_pattern capture</text>
  <path d="M60,540 L60,618" fill="none" stroke="#1e7e34" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <text x="68" y="566" text-anchor="start" font-size="9" font-weight="normal" fill="#1e7e34" font-style="italic">DT.get_send_data(value)</text>
  <text x="68" y="578" text-anchor="start" font-size="9" font-weight="normal" fill="#1e7e34" font-style="italic">→ device value</text>
  <path d="M250,540 L250,618" fill="none" stroke="#2a5db0" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="258" y="566" text-anchor="start" font-size="9" font-weight="normal" fill="#2a5db0" font-style="italic">DT.get_shng_data(raw)</text>
  <text x="258" y="578" text-anchor="start" font-size="9" font-weight="normal" fill="#2a5db0" font-style="italic">→ value</text>
  <rect x="40" y="620" width="380" height="46" rx="5" fill="#fef7e0" stroke="#f9ab00" stroke-width="1.5"/>
  <text x="230" y="640" text-anchor="middle" font-size="11" font-weight="bold" fill="#9c6e00">Datatype  DT_*</text>
  <text x="230" y="654" text-anchor="middle" font-size="9" font-weight="normal" fill="#555">item value ⇄ device value</text>
  <text x="230" y="690" text-anchor="middle" font-size="10" font-weight="bold" fill="#9c6e00">conversion — called by the plugin, returns to it</text>
  <path d="M520,300 L970,300 L970,550 L520,550 L520,300" fill="none" stroke="#4a86e8" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="528" y="313" text-anchor="start" font-size="9" font-weight="bold" fill="#2a5db0">self._connection</text>
  <path d="M560,262 L560,348" fill="none" stroke="#1e7e34" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <text x="568" y="278" text-anchor="start" font-size="9" font-weight="normal" fill="#1e7e34" font-style="italic">send(data_dict, resend_info=…)</text>
  <text x="568" y="290" text-anchor="start" font-size="9" font-weight="normal" fill="#1e7e34" font-style="italic">→ reply (sync) | None (async)</text>
  <path d="M800,348 L800,264" fill="none" stroke="#2a5db0" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="808" y="280" text-anchor="start" font-size="9" font-weight="normal" fill="#2a5db0" font-style="italic">hooks.on_data(by, data[, command])</text>
  <text x="808" y="292" text-anchor="start" font-size="9" font-weight="normal" fill="#2a5db0" font-style="italic">= plugin.on_data_received</text>
  <rect x="540" y="350" width="410" height="50" rx="5" fill="#f3e8fd" stroke="#a142f4" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="745" y="372" text-anchor="middle" font-size="11" font-weight="bold" fill="#681da8">SDPProtocol  (optional)</text>
  <text x="745" y="386" text-anchor="middle" font-size="9" font-weight="normal" fill="#555">framing, message ids, resend, handshake</text>
  <path d="M560,400 L560,478" fill="none" stroke="#1e7e34" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <text x="568" y="426" text-anchor="start" font-size="9" font-weight="normal" fill="#1e7e34" font-style="italic">send(data_dict)</text>
  <text x="568" y="438" text-anchor="start" font-size="9" font-weight="normal" fill="#1e7e34" font-style="italic">→ reply | None</text>
  <path d="M800,478 L800,402" fill="none" stroke="#2a5db0" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="808" y="426" text-anchor="start" font-size="9" font-weight="normal" fill="#2a5db0" font-style="italic">on_data(by, data)</text>
  <text x="808" y="438" text-anchor="start" font-size="9" font-weight="normal" fill="#2a5db0" font-style="italic">(JSON-RPC: by, json, method)</text>
  <rect x="540" y="480" width="410" height="50" rx="5" fill="#e6f4ea" stroke="#34a853" stroke-width="1.5"/>
  <text x="745" y="502" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e7e34">SDPConnection  (transport)</text>
  <text x="745" y="516" text-anchor="middle" font-size="9" font-weight="normal" fill="#555">_send(data_dict): payload, limit_response</text>
  <path d="M560,530 L560,618" fill="none" stroke="#1e7e34" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <text x="568" y="562" text-anchor="start" font-size="9" font-weight="normal" fill="#1e7e34" font-style="italic">payload str → bytes (UTF-8)</text>
  <text x="568" y="574" text-anchor="start" font-size="9" font-weight="normal" fill="#1e7e34" font-style="italic">Tcp_client.send / serial write</text>
  <path d="M800,618 L800,532" fill="none" stroke="#2a5db0" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="808" y="562" text-anchor="start" font-size="9" font-weight="normal" fill="#2a5db0" font-style="italic">callback(client, line)</text>
  <text x="808" y="574" text-anchor="start" font-size="9" font-weight="normal" fill="#2a5db0" font-style="italic">one line per terminator</text>
  <rect x="540" y="620" width="410" height="46" rx="5" fill="#f1f3f4" stroke="#9aa0a6" stroke-width="1.5"/>
  <text x="745" y="640" text-anchor="middle" font-size="11" font-weight="bold" fill="#3c4043">I/O library</text>
  <text x="745" y="654" text-anchor="middle" font-size="9" font-weight="normal" fill="#555">Tcp_client, pyserial, requests, socket</text>
  <path d="M560,666 L560,718" fill="none" stroke="#1e7e34" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <text x="568" y="696" text-anchor="start" font-size="9" font-weight="normal" fill="#1e7e34" font-style="italic">bytes</text>
  <path d="M800,718 L800,668" fill="none" stroke="#2a5db0" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="808" y="696" text-anchor="start" font-size="9" font-weight="normal" fill="#2a5db0" font-style="italic">bytes</text>
  <rect x="540" y="720" width="410" height="36" rx="5" fill="#ffffff" stroke="#9aa0a6" stroke-width="1.5"/>
  <text x="745" y="742" text-anchor="middle" font-size="11" font-weight="bold" fill="#3c4043">Device</text>
  <rect x="40" y="790" width="920" height="186" rx="5" fill="#ffffff" stroke="#9aa0a6" stroke-width="1.5"/>
  <text x="56" y="810" text-anchor="start" font-size="11" font-weight="bold" fill="#333">Trace: MPD example, item mpd.volume (values from the real stack)</text>
  <text x="56" y="832" text-anchor="start" font-size="10" font-weight="bold" fill="#1e7e34">send</text>
  <text x="510" y="832" text-anchor="start" font-size="10" font-weight="bold" fill="#2a5db0">receive</text>
  <text x="56" y="852" text-anchor="start" font-size="9" font-weight="normal" fill="#333" font-family="Menlo, Consolas, monospace">item = 50 → update_item → send_command(&#x27;status.volume&#x27;, 50)</text>
  <text x="56" y="871" text-anchor="start" font-size="9" font-weight="normal" fill="#333" font-family="Menlo, Consolas, monospace">DT_int.get_send_data(50) → 50</text>
  <text x="56" y="890" text-anchor="start" font-size="9" font-weight="normal" fill="#333" font-family="Menlo, Consolas, monospace">get_send_data → {&#x27;payload&#x27;: &#x27;setvol 50&#x27;, &#x27;data&#x27;: 50}</text>
  <text x="56" y="909" text-anchor="start" font-size="9" font-weight="normal" fill="#333" font-family="Menlo, Consolas, monospace">_transform_send_data → {&#x27;payload&#x27;: &#x27;setvol 50\n&#x27;, &#x27;data&#x27;: 50,</text>
  <text x="56" y="928" text-anchor="start" font-size="9" font-weight="normal" fill="#333" font-family="Menlo, Consolas, monospace">                         &#x27;limit_response&#x27;: b&#x27;\n&#x27;}</text>
  <text x="56" y="947" text-anchor="start" font-size="9" font-weight="normal" fill="#333" font-family="Menlo, Consolas, monospace">Tcp_client.send → b&#x27;setvol 50\n&#x27;</text>
  <text x="510" y="852" text-anchor="start" font-size="9" font-weight="normal" fill="#333" font-family="Menlo, Consolas, monospace">b&#x27;volume: 42\n&#x27; → Tcp_client → callback(client, &#x27;volume: 42&#x27;)</text>
  <text x="510" y="871" text-anchor="start" font-size="9" font-weight="normal" fill="#333" font-family="Menlo, Consolas, monospace">on_data_received(by, &#x27;volume: 42&#x27;)</text>
  <text x="510" y="890" text-anchor="start" font-size="9" font-weight="normal" fill="#333" font-family="Menlo, Consolas, monospace">get_commands_from_reply → [&#x27;status.volume&#x27;]</text>
  <text x="510" y="909" text-anchor="start" font-size="9" font-weight="normal" fill="#333" font-family="Menlo, Consolas, monospace">get_shng_data: capture &#x27;42&#x27; → DT_int → 42</text>
  <text x="510" y="928" text-anchor="start" font-size="9" font-weight="normal" fill="#333" font-family="Menlo, Consolas, monospace">dispatch_data(&#x27;status.volume&#x27;, 42, by) → item(42, plugin)</text>
  <rect x="40" y="992" width="14" height="11" rx="2" fill="#e6f4ea" stroke="#34a853"/>
  <text x="60" y="1001" text-anchor="start" font-size="9" font-weight="normal" fill="#555">send path (item → device)</text>
  <rect x="230" y="992" width="14" height="11" rx="2" fill="#e8f0fe" stroke="#4a86e8"/>
  <text x="250" y="1001" text-anchor="start" font-size="9" font-weight="normal" fill="#555">receive path (device → item)</text>
  <text x="960" y="1001" text-anchor="end" font-size="9" font-weight="normal" fill="#555" font-style="italic">arrow = call direction · &quot;→ x&quot; = return value</text>
</svg>
