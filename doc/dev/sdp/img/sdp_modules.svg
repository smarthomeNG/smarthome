  <text x="30" y="600" text-anchor="start" font-size="9" font-weight="normal" fill="#555" font-style="italic">Not imports: smartdeviceplugin loads &lt;plugin&gt;.commands and &lt;plugin&gt;.datatypes by name (pydoc.locate)</text>
  <text x="30" y="614" text-anchor="start" font-size="9" font-weight="normal" fill="#555" font-style="italic">and uses the classes the plugin names in PROTOCOL / COMMAND_CLASS / TransportRule(use=...).</text>
